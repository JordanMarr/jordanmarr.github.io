<!-- Open Graph / Facebook -->
<meta property="og:type" content="article">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | default: 'F# blog by Jordan Marr' }}">
<meta property="og:site_name" content="Jordan Marr's Blog">

<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@jordan_n_marr">
<meta name="twitter:creator" content="@jordan_n_marr">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | default: 'F# blog by Jordan Marr' }}">

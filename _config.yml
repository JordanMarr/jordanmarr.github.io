# Site Settings
title: Jordan Marr
subtitle: F# and functional programming
description: A blog about F#, Fable, and functional programming in .NET
url: https://jordanmarr.github.io

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# Author
author:
  name: "Jordan Marr"
  bio: ".NET developer since 1.0. F# enthusiast since 2018."
  links:
    - label: "Twitter/X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/jordan_n_marr"
    - label: "Bluesky"
      icon: "fas fa-fw fa-cloud"
      url: "https://bsky.app/profile/jordanmarr.bsky.social"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/JordanMarr"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

# Reading
read_time: true
words_per_minute: 200
